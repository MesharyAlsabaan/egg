<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>الصفحة غير موجودة | Page not found — بيض العائلة للتجارة</title>
    <link rel="icon" href="/brand/favicon.png" sizes="32x32" />
    <!-- Served by `serve` with a 404 status for any unknown path. Static on
         purpose: no app bundle, no route, nothing for a crawler to index. -->
    <style>
      @font-face {
        font-family: 'Madani Arabic';
        src: url('/fonts/madani-arabic-400.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      :root {
        --ink: #283c22;
        --olive: #657331;
        --orange: #f49320;
        --ivory: #f8f9f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--ivory);
        color: var(--ink);
        font-family: 'Madani Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.7;
      }
      main {
        width: min(100%, 34rem);
        display: grid;
        gap: 2rem;
      }
      img {
        width: 150px;
        height: auto;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.6rem;
        line-height: 1.35;
      }
      p {
        margin: 0;
        color: #5c6b52;
      }
      section + section {
        padding-top: 2rem;
        border-top: 1px solid #e4e7dd;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        margin: 1rem 0 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--olive);
        font-weight: 600;
        text-underline-offset: 4px;
      }
      a:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-lockup-240.png" width="240" height="103" alt="بيض العائلة للتجارة — Family Eggs" />
      <section>
        <h1>الصفحة غير موجودة</h1>
        <p>ربما تغيّر الرابط أو كُتب بشكل غير صحيح.</p>
        <ul>
          <li><a href="/ar">الصفحة الرئيسية</a></li>
          <li><a href="/ar/wholesale">التوريد بالجملة</a></li>
          <li><a href="/ar/international">المشترون الدوليون</a></li>
        </ul>
      </section>
      <section lang="en" dir="ltr">
        <h1>Page not found</h1>
        <p>The link may have changed, or it was mistyped.</p>
        <ul>
          <li><a href="/en">Home</a></li>
          <li><a href="/en/wholesale">Wholesale supply</a></li>
          <li><a href="/en/international">International buyers</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
