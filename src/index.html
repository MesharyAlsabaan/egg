    />

    <!-- Madani Arabic, self-hosted. Body and display weights are preloaded so
         the first screen renders in the brand face; 500 and 600 follow from
         the stylesheet a moment later. -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/madani-arabic-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/madani-arabic-700.woff2" crossorigin />

    <!-- The hero poster is the LCP candidate. Two preloads, each behind its
         own media query, so a phone never fetches the 1920px landscape frame
         and a desktop never stretches the portrait one. -->
    <link
      rel="preload"
      as="image"
      media="(max-width: 767px)"
      href="media/hero-poster-mobile-1080.avif"
      imagesrcset="media/hero-poster-mobile-720.avif 720w, media/hero-poster-mobile-1080.avif 1080w"
      imagesizes="100vw"
      type="image/avif"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(min-width: 768px)"
      href="media/hero-poster-desktop-1600.avif"
      imagesrcset="
        media/hero-poster-desktop-1280.avif 1280w,
        media/hero-poster-desktop-1600.avif 1600w,
        media/hero-poster-desktop-1920.avif 1920w
      "
      imagesizes="100vw"
      type="image/avif"
      fetchpriority="high"
    />
